name: Release

# Builds installers for Windows, macOS and Linux and attaches them to a
# GitHub Release. Push a tag such as v1.0.1 to start a release.
#
# Windows code signing (free, SignPath Foundation) switches on once the repository has the
# variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN. Until then Windows
# builds are unsigned, as before. See CODE_SIGNING.md.
#
# Playback of SoundCloud's copy-protected label songs needs a castlabs "VMP signature" on every
# Windows and macOS build. It comes from a free castlabs EVS account: the repository must have the
# secrets EVS_ACCOUNT_NAME and EVS_PASSWD (that account's name and password).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run check

  release:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS builds get the castlabs playback signature (made before Apple code signing). Linux needs none.
      - name: Set up Python (castlabs signature)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the castlabs signing tool
        if: runner.os == 'macOS'
        run: python -m pip install --upgrade castlabs-evs

      - name: Check the castlabs sign-in
        if: runner.os == 'macOS'
        run: python -m castlabs_evs.account reauth
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'
          QUANTM_PYTHON: python

      - name: Generate and upload installer checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OS: ${{ matrix.os }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { createReadStream, readdirSync, writeFileSync } = require('node:fs');
          (async () => {
            const files = readdirSync('dist').filter(name => /\.(exe|dmg|AppImage|deb)$/.test(name)).sort();
            if (!files.length) throw new Error('No installers found in dist');
            const lines = [];
            for (const name of files) {
              const hash = createHash('sha256');
              for await (const chunk of createReadStream(`dist/${name}`)) hash.update(chunk);
              lines.push(`${hash.digest('hex')}  ${name}`);
            }
            writeFileSync(`dist/SHA256SUMS-${process.env.RELEASE_OS}.txt`, lines.join('\n') + '\n');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          gh release upload "$GITHUB_REF_NAME" "dist/SHA256SUMS-${RELEASE_OS}.txt" --clobber

  # Windows runs after macOS/Linux so the release already exists
  windows:
    needs: [test, release]
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # castlabs playback signature: the unsigned path signs inside electron-builder (afterSign hook),
      # the signed path signs the SignPath output below
      - name: Set up Python (castlabs signature)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the castlabs signing tool
        run: python -m pip install --upgrade castlabs-evs

      - name: Check the castlabs sign-in
        run: python -m castlabs_evs.account reauth
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'

      # --- unsigned (no SignPath set up yet) ---
      - name: Build and publish (unsigned)
        if: env.SIGNING != 'true'
        run: npx electron-builder --win --publish always
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'
          QUANTM_PYTHON: python

      # --- signed: 1) sign the app files, 2) build installers from them, 3) sign the installers ---
      - name: Build the app folder
        if: env.SIGNING == 'true'
        run: npx electron-builder --win --dir --publish never
        env:
          # SignPath changes Quantm.exe afterwards, which would invalidate a castlabs signature made now,
          # and castlabs requires the signature after code signing on Windows. It is added below instead.
          QUANTM_SKIP_VMP: '1'

      - name: Upload the unsigned app for signing
        if: env.SIGNING == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: dist/win-unpacked/
          if-no-files-found: error

      - name: Sign the app (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Quantm' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Add the playback signature (castlabs)
        if: env.SIGNING == 'true'
        run: |
          python -m castlabs_evs.vmp sign-pkg signed-app
          python -m castlabs_evs.vmp verify-pkg signed-app
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'

      - name: Build the installers from the signed app
        if: env.SIGNING == 'true'
        shell: bash
        run: |
          rm -rf dist
          npx electron-builder --win nsis portable --prepackaged signed-app --publish never
          # fail the job if building the installers changed the signed exe
          python -m castlabs_evs.vmp verify-pkg signed-app
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'

      - name: Upload the unsigned installers for signing
        if: env.SIGNING == 'true'
        id: unsigned-installers
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: dist/*.exe
          if-no-files-found: error

      - name: Sign the installers (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Quantm' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers

      - name: Publish the signed installers
        if: env.SIGNING == 'true'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP="Quantm-Setup-${VERSION}.exe"
          cp signed-installers/*.exe dist/
          # the signed installer has new bytes: make the auto-updater manifest match it
          node .github/scripts/signed-latest-yml.js dist/latest.yml "dist/${SETUP}"
          # the blockmap describes the unsigned file; without it updates download in full
          rm -f dist/*.blockmap
          gh release upload "$GITHUB_REF_NAME" "dist/${SETUP}" "dist/Quantm-${VERSION}-Portable.exe" dist/latest.yml --clobber

      - name: Generate and upload installer checksums
        shell: bash
        env:
          RELEASE_OS: windows-latest
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { createReadStream, readdirSync, writeFileSync } = require('node:fs');
          (async () => {
            const files = readdirSync('dist').filter(name => /\.(exe|dmg|AppImage|deb)$/.test(name)).sort();
            if (!files.length) throw new Error('No installers found in dist');
            const lines = [];
            for (const name of files) {
              const hash = createHash('sha256');
              for await (const chunk of createReadStream(`dist/${name}`)) hash.update(chunk);
              lines.push(`${hash.digest('hex')}  ${name}`);
            }
            writeFileSync(`dist/SHA256SUMS-${process.env.RELEASE_OS}.txt`, lines.join('\n') + '\n');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          gh release upload "$GITHUB_REF_NAME" "dist/SHA256SUMS-${RELEASE_OS}.txt" --clobber

  # electron-builder doesn't write notes when it publishes straight away, so add them afterwards
  notes:
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/${VERSION}/g" .github/RELEASE_NOTES.md > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
